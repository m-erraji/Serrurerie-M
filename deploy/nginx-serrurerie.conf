# Server blocks for serrurerie.medxd.me. Install with:
#   sudo certbot certonly --nginx -d serrurerie.medxd.me   # before enabling: the cert must exist
#   sudo cp ~/Serrurerie-M/deploy/nginx-serrurerie.conf /etc/nginx/sites-available/serrurerie
#   sudo ln -s /etc/nginx/sites-available/serrurerie /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP: redirect everything to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name serrurerie.medxd.me;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name serrurerie.medxd.me;

    ssl_certificate /etc/letsencrypt/live/serrurerie.medxd.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/serrurerie.medxd.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /home/medxd/serrurerie-app/current;
    index index.html;

    # Each page is ~1 MB of raw HTML (component CSS inlined in shadow roots),
    # ~50 KB gzipped: compression is not optional here.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Hashed build assets never change: long cache. add_header here replaces the
    # server-level headers, so the security headers are repeated.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # trailingSlash: 'always' -> /en/ is served from /en/index.html.
    location / {
        try_files $uri $uri/ =404;
    }
}
